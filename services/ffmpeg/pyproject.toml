[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentecostal-ffmpeg"
version = "0.1.0"
description = "Pure-function FFmpeg relay command builder for Pentecostal Live"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pentecostal_ffmpeg*"]
