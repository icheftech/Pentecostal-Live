services:
  postgres:
    image: postgres:16
    container_name: pentecostal_live_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pentecostal_live
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../../apps/api
    container_name: pentecostal_live_api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ../../.env
    environment:
      PENTECOSTAL_LIVE_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pentecostal_live
    ports:
      - "8000:8000"

volumes:
  postgres_data:
